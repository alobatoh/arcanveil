<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCANVEIL</title>

<!-- La portada del sitio lleva al juego, que tiene una sola interfaz:
     `app/`. La original de las fases 1-3 se retiró el 7-oct-2026;
     `clasico.html` queda solo como puente a esta misma dirección.

     El redirector va por tres vías porque cada una cubre un hueco de la
     anterior: `replace` no ensucia el historial (el botón atrás del móvil
     volvería aquí y rebotaría en bucle), el `meta refresh` cubre a quien
     tenga JavaScript desactivado, y el enlace visible cubre a quien llegue
     con ambos bloqueados. Todas las rutas son relativas: GitHub Pages sirve
     esto desde un subdirectorio, no desde la raíz del dominio. -->
<meta http-equiv="refresh" content="0; url=./app/index.html">
<link rel="canonical" href="./app/index.html">

<style>
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;text-align:center;padding:2rem;
    background:#11101f;color:#e8ddc6;
    font:16px/1.6 Georgia,'Times New Roman',serif;
  }
  a{color:#e2bd63}
  p{margin:.6rem 0;font-size:.9rem;color:#9b8f7a}
  strong{
    display:block;font-size:clamp(2rem,9vw,3.4rem);letter-spacing:.06em;
    color:#f0d58a;margin-bottom:.4rem;
  }
</style>
</head>
<body>
  <div>
    <strong>ARCANVEIL</strong>
    <p>Abriendo la crónica…</p>
    <p><a href="./app/index.html">Entrar al juego</a></p>
  </div>

  <script>
    // `replace` en vez de `href`: así esta página no queda en el historial y
    // el botón «atrás» sale del sitio en vez de rebotar aquí otra vez.
    location.replace('./app/index.html');
  </script>
</body>
</html>
